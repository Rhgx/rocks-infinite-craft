name: Build and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            bash ./gradlew --no-daemon build "-Pmod_version=${RELEASE_TAG#v}"
          else
            bash ./gradlew --no-daemon build
          fi
      - name: Save JARs
        uses: actions/upload-artifact@v4
        with:
          name: rocks-infinite-craft
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rocks-infinite-craft
          path: jars
      - name: Attach JARs to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$RELEASE_TAG" --title "RIC ${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" jars/*.jar --clobber
