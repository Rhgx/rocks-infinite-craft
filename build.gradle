plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

version = project.mod_version
group = 'dev.rocks'
base { archivesName = 'ric' }
tasks.withType(Jar).configureEach {
    archiveVersion = "${project.mod_version}+${project.minecraft_version}"
    from('LICENSE')
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.blamejared.com/' }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        rocks_infinite_craft {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    clientImplementation 'me.shedaniel.cloth:cloth-config-fabric:26.2.155'
    clientImplementation 'com.terraformersmc:modmenu:20.0.1'
    // JEI is optional; only its API is needed to build the plugin.
    clientCompileOnly 'mezz.jei:jei-26.2-fabric-api:30.38.0.229'
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs.add('-Xlint:deprecation')
}
java { withSourcesJar() }
configurations.testRuntimeClasspath {
    exclude group: 'me.shedaniel.cloth'
    exclude group: 'com.terraformersmc', module: 'modmenu'
}
test {
    useJUnitPlatform()
    systemProperty 'fabric.side', 'server'
}
